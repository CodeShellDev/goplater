name: Update README

on:
  push:
    branches:
      - main
    paths:
      - examples/**
      - .github/templates/README.template.md

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    steps:
      - name: Generate Goplater App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GOPLATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOPLATER_APP_PRIVATE_KEY }}

  update:
    needs: prepare
    uses: codeshelldev/goplater-action/.github/workflows/goplater-bot.yml@main
    name: Update
    with:
      path: .github/templates/README.template.md
      output: README.md
      commit-and-push: false
      commit-message: "auto: update README.md"
      branch: "auto/update-README.md-${{ github.run_number }}"
      pr-assignees: codeshelldev
    secrets:
      token: ${{ needs.prepare.outputs.app-token }}
