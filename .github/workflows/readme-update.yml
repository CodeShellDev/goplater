name: Update README

on:
  push:
    branches:
      - main
    paths:
      - examples/**
      - .github/templates/README.template.md

jobs:
  build:
    runs-on: ubuntu-latest
    name: Template README.template.md

    steps:
      - uses: actions/checkout@v7
      - name: Run goplater
        uses: codeshelldev/goplater-action@v0.0.2
        with:
          source: .github/templates/README.template.md
          output: README.md
