name: Update README

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pkg/gplt/modules/**
      - examples/**
      - .github/templates/**

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: codeshelldev/goplater-action/.github/workflows/goplater-bot.yml@main
    name: Update
    with:
      path: .github/templates/README.template.md
      output: README.md
      commit-and-push: false
      commit-message: "auto: update README.md"
      branch: "auto/update-README.md-${{ github.run_number }}"
      pr-assignees: codeshelldev
      pr-title: "auto: update README.md"
      client-id: ${{ vars.GOPLATER_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.GOPLATER_APP_PRIVATE_KEY }}
