name: Update README

on:
  push:
    branches:
      - main
    paths:
      - examples/**
      - .github/templates/README.template.md

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: codeshelldev/goplater-action/.github/workflows/goplater-bot.yml@main
    name: Update
    with:
      path: .github/templates/README.template.md
      output: README.md
      commit-and-push: false
      commit-message: "auto: update README.md"
      branch: "auto/update-README.md-${{ github.run_number }}"
      pr-assignees: codeshelldev
