name: Build & Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Release ${{ github.event.release.tag_name }}

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - name: Build binaries
        uses: codeshelldev/gh-actions/go-build@v1.0.3
        with:
          platforms: linux/amd64,linux/arm64,darwin/amd64,windows/amd64
          output-pattern: dist/goplater-${{ github.event.release.tag_name }}-{os}-{arch}
          build-args: |
            Version=${{ github.event.release.tag_name }}
            Commit=${{ github.sha }}

      - name: Attach to release
        uses: codeshelldev/gh-actions/gh-releaser@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag-name: ${{ github.event.release.tag_name }}
          input-pattern: dist/{name}-${{ github.event.release.tag_name }}-{os}-{arch}
          output-pattern: "{name}-${{ github.event.release.tag_name }}-{os}-{arch}"

      - name: Publish npm package
        run: |
          cp -r dist/* npm/bin/
          chmod +x -R npm/bin/
          cp README.md npm/
          cp LICENSE npm/
          cd npm/
          npm version ${{ github.event.release.tag_name }} --no-git-tag-version
          npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PCKG_TOKEN }}
